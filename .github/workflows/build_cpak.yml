name: Build cpak

on:
  push:
    branches: ["**"]
    tags: ["*"]
  schedule:
    - cron: '40 7 * * 2'
  workflow_dispatch:

permissions:
  contents: write
  packages: write
  attestations: write
  id-token: write

concurrency:
  group: build-cpak-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build:
    strategy:
      fail-fast: false
      matrix:
        include:
          - arch: amd64
            platform: linux/amd64
            runner: ubuntu-latest
          - arch: arm64
            platform: linux/arm64
            runner: ubuntu-24.04-arm
    runs-on: ${{ matrix.runner }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1

      - uses: docker/setup-buildx-action@37fe631027851001ddb9b187196cc803df7f5f0e

      - uses: docker/login-action@dbcb813823bdd20940b903addbd779551569679f
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - id: identity
        shell: bash
        run: |
          tag="${GITHUB_REF_NAME//\//-}-${{ matrix.arch }}"
          echo "tag=$tag" >> "$GITHUB_OUTPUT"
          echo "image=ghcr.io/bottlesdevs/bottles:$tag" >> "$GITHUB_OUTPUT"

      - id: meta
        uses: docker/metadata-action@dc802804100637a589fabce1cb79ff13a1411302
        with:
          images: ghcr.io/bottlesdevs/bottles
          tags: type=raw,value=${{ steps.identity.outputs.tag }}

      - id: build
        uses: docker/build-push-action@53b7df96c91f9c12dcc8a07bcb9ccacbed38856a
        with:
          context: .
          file: build-aux/cpak/Containerfile
          platforms: ${{ matrix.platform }}
          push: true
          pull: true
          tags: ${{ steps.meta.outputs.tags }}
          labels: ${{ steps.meta.outputs.labels }}
          cache-from: type=gha,scope=bottles-${{ matrix.arch }}
          cache-to: type=gha,mode=max,scope=bottles-${{ matrix.arch }}
          provenance: mode=max
          sbom: true

      - name: Verify image
        env:
          IMAGE: ${{ steps.identity.outputs.image }}
          EXPECTED_ARCH: ${{ matrix.arch }}
        run: |
          docker run --rm \
            --entrypoint sh \
            --env EXPECTED_ARCH \
            "$IMAGE" -ceu '
              test "$(dpkg --print-architecture)" = "$EXPECTED_ARCH"
              test -x /usr/bin/bottles
              test -x /usr/bin/bottles-real
              test -x /usr/bin/bottles-cli
              test -x /usr/local/bin/umu-run
              bottles-cli --version
            '

      - name: Verify Soda on arm64
        if: matrix.arch == 'arm64'
        env:
          GH_TOKEN: ${{ github.token }}
          IMAGE: ${{ steps.identity.outputs.image }}
        run: |
          mkdir -p /tmp/soda-arm64
          gh release download soda-11.0-10 \
            --repo bottlesdevs/wine \
            --pattern 'soda-11.0-10-aarch64.tar.xz' \
            --dir /tmp/soda-arm64
          tar -C /tmp/soda-arm64 -xJf /tmp/soda-arm64/soda-11.0-10-aarch64.tar.xz
          runner="$(find /tmp/soda-arm64 -mindepth 1 -maxdepth 1 -type d -name 'soda-*-aarch64' -print -quit)"
          test -n "$runner"
          docker run --rm \
            --entrypoint sh \
            --volume "$runner:/runner:ro" \
            "$IMAGE" -ceu '
              apt-get update
              apt-get install -y --no-install-recommends xauth xvfb
              export FEX_APP_CONFIG=/runner/share/fex-emu/Config.json
              export FEX_APP_CONFIG_LOCATION=/runner/share/fex-emu
              export LD_LIBRARY_PATH="/runner/lib:/runner/lib/wine/aarch64-unix:$LD_LIBRARY_PATH"
              export WINEARCH=win64
              export WINEDEBUG=-all
              export WINEPREFIX=/tmp/soda-arm64-prefix
              ldd /runner/bin/wine | tee /tmp/soda-ldd.log
              ! grep -F "not found" /tmp/soda-ldd.log
              xvfb-run -a /runner/bin/wine wineboot -u
              native="$(xvfb-run -a /runner/bin/wine cmd /c echo "%PROCESSOR_ARCHITECTURE%" | tr -d "\r" | grep -E "^(ARM64|AMD64|x86)$" | tail -1)"
              x64="$(xvfb-run -a /runner/bin/wine /runner/lib/wine/x86_64-windows/cmd.exe /c echo "%PROCESSOR_ARCHITECTURE%" | tr -d "\r" | grep -E "^(ARM64|AMD64|x86)$" | tail -1)"
              x86="$(xvfb-run -a /runner/bin/wine /runner/lib/wine/i386-windows/cmd.exe /c echo "%PROCESSOR_ARCHITECTURE%" | tr -d "\r" | grep -E "^(ARM64|AMD64|x86)$" | tail -1)"
              test "$native" = ARM64
              test "$x64" = AMD64
              test "$x86" = x86
              printf "Soda architectures: native=%s, x64=%s, x86=%s\n" "$native" "$x64" "$x86"
              /runner/bin/wineserver -w
            '

      - name: Publish summary
        run: echo "${{ steps.identity.outputs.image }}@${{ steps.build.outputs.digest }}" >> "$GITHUB_STEP_SUMMARY"

  index:
    needs: build
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1

      - uses: docker/setup-buildx-action@37fe631027851001ddb9b187196cc803df7f5f0e

      - uses: docker/login-action@dbcb813823bdd20940b903addbd779551569679f
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - id: publish
        shell: bash
        run: |
          tag="${GITHUB_REF_NAME//\//-}"
          image="ghcr.io/bottlesdevs/bottles:$tag"
          docker buildx imagetools create \
            --tag "$image" \
            --tag "ghcr.io/bottlesdevs/bottles:sha-${GITHUB_SHA::7}" \
            "ghcr.io/bottlesdevs/bottles:$tag-amd64" \
            "ghcr.io/bottlesdevs/bottles:$tag-arm64"
          manifest="$(docker buildx imagetools inspect --raw "$image")"
          jq -e '.manifests[] | select(.platform.architecture == "amd64" and .platform.os == "linux")' <<< "$manifest"
          jq -e '.manifests[] | select(.platform.architecture == "arm64" and .platform.os == "linux")' <<< "$manifest"
          digest="$(docker buildx imagetools inspect "$image" | awk '$1 == "Digest:" && digest == "" {digest=$2} END {print digest}')"
          test -n "$digest"
          echo "image=$image" >> "$GITHUB_OUTPUT"
          echo "digest=$digest" >> "$GITHUB_OUTPUT"

      - name: Pin published image
        if: github.ref == 'refs/heads/main'
        env:
          IMAGE_DIGEST: ${{ steps.publish.outputs.digest }}
        run: |
          repository="$(jq -r '.image | split("@")[0]' cpak.json)"
          jq --arg image "${repository}@${IMAGE_DIGEST}" '.image = $image' cpak.json > cpak.json.next
          mv cpak.json.next cpak.json
          if ! git diff --quiet -- cpak.json; then
            git config user.name "github-actions[bot]"
            git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
            git add cpak.json
            git commit -m "chore: pin published image [skip ci]"
            git push origin "HEAD:${{ github.event.repository.default_branch }}"
          fi

      - uses: sigstore/cosign-installer@6f9f17788090df1f26f669e9d70d6ae9567deba6

      - name: Install cpak-sign
        run: |
          curl -fsSLO https://github.com/Containerpak/cpak/releases/download/v2.12.7/cpak-sign-linux-amd64
          echo '4b77884bc2464aa500540523e23ac84e6bd1a07df148e0df0334389d2f09ad6c  cpak-sign-linux-amd64' | sha256sum -c -
          install -Dm755 cpak-sign-linux-amd64 /usr/local/bin/cpak-sign

      - name: Sign the package state
        env:
          CPAK_REGISTRY_USERNAME: ${{ github.actor }}
          CPAK_REGISTRY_PASSWORD: ${{ secrets.GITHUB_TOKEN }}
        run: |
          repository="$(printf '%s' '${{ github.repository }}' | tr '[:upper:]' '[:lower:]')"
          image="$(jq -r '.image' cpak.json)"
          index="$(docker buildx imagetools inspect --raw "$image")"
          for arch in amd64 arm64; do
            digest="$(jq -er --arg arch "$arch" '.manifests[] | select(.platform.os == "linux" and .platform.architecture == $arch) | .digest' <<< "$index")"
            state="cpak-state-${arch}"
            bundle="${state}.sigstore.json"
            cpak-sign state \
              --origin "github.com/${repository}" \
              --image-digest "$digest" \
              --generation "${{ github.run_number }}" \
              --output "$state"
            cosign sign-blob --yes --new-bundle-format=true \
              --bundle "$bundle" "$state"
            cpak-sign attach \
              --image "ghcr.io/${repository}" \
              --state "$state" \
              --bundle "$bundle"
          done

      - name: Publish summary
        run: docker buildx imagetools inspect "${{ steps.publish.outputs.image }}" >> "$GITHUB_STEP_SUMMARY"
